[package]
name = "nes-headerless-fixer"
version = "0.2.0"
description = "Turns headered NES ROMs into the headerless .unh files a RomVault fixdat asks for."
authors = ["Steven Demanett"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
zip = "8.6.0"
sevenz-rust2 = "0.23.0"
roxmltree = "0.21.1"
crc32fast = "1.5.2"
sha1 = "0.11.0"
md-5 = "0.11.0"
rayon = "1.12.0"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
